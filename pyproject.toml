[project]
name = "bonsai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40,<1.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
bonsai = "bonsai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bonsai"]

[tool.ruff]
line-length = 100
